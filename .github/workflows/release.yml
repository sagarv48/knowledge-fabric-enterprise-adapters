name: Release & Distribution

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: "Publish Python package to PyPI"
        type: boolean
        default: true
      publish_docker:
        description: "Build and push container image to GHCR"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Build & Publish Python Wheel to PyPI
  # ----------------------------------------------------------------------------
  publish-pypi:
    name: Build & Publish to PyPI
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.publish_pypi
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install --upgrade build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate distribution integrity
        run: twine check dist/*

      - name: Publish package to PyPI
        if: startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@release/v1
        continue-on-error: true
        with:
          skip-existing: true

  # ----------------------------------------------------------------------------
  # Job 2: Build & Publish Multi-Arch OCI Container to GHCR
  # ----------------------------------------------------------------------------
  publish-docker:
    name: Build & Push Container to GHCR
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.publish_docker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push container image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
